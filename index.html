<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Memora — AI Study Companion</title>
    <meta name="description" content="Turn your lessons into reviewers, quizzes, flashcards, and smarter study materials. Memora is a bring-your-own-key AI study app: learn, review, remember." />
    <meta name="application-name" content="Memora" />
    <meta name="theme-color" content="#0f1320" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/branding/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/branding/icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Memora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memora" />
    <meta property="og:title" content="Memora — AI Study Companion" />
    <meta property="og:description" content="Learn • Review • Remember. Turn your lessons into reviewers, quizzes, and flashcards." />
    <meta property="og:image" content="/branding/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Memora — AI Study Companion" />
    <meta name="twitter:description" content="Learn • Review • Remember. Turn your lessons into reviewers, quizzes, and flashcards." />
    <meta name="twitter:image" content="/branding/og-image.png" />

    <script>
      // Runs before first paint so there is no theme flash. Mirrors src/hooks/useTheme.tsx.
      // Key name is legacy (kept so saved preferences survive the rebrand).
      (function () {
        try {
          var stored = localStorage.getItem("studykey-theme");
          var light =
            stored === "light" ||
            (stored !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.setAttribute("data-theme", "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", light ? "#3F5BDB" : "#0f1320");
        } catch (e) {}
      })();
    </script>
    <style>
      /* Launch screen — replaced as soon as React mounts. */
      .memora-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0f1320; color: #f4f5f9; font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      html[data-theme="light"] .memora-splash { background: #f7f7fb; color: #161b2e; }
      .memora-splash img { width: 72px; height: 72px; border-radius: 16px; animation: memora-pop .35s ease-out both; }
      .memora-splash .ico-light { display: none; }
      html[data-theme="light"] .memora-splash .ico-light { display: block; }
      html[data-theme="light"] .memora-splash .ico-dark { display: none; }
      .memora-splash span { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      @keyframes memora-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .memora-splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="memora-splash" role="status" aria-label="Loading Memora">
        <img class="ico-dark" src="/branding/icon-dark.svg" alt="" />
        <img class="ico-light" src="/branding/icon-light.svg" alt="" />
        <span>Memora</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
